<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SkyAPI — assistente de operações da API Skymail." />
    <meta name="robots" content="noindex, nofollow" />
    <title>SkyAPI — Assistente de operações</title>
    <base href="/" />
    <link rel="icon" href="skyapi.ico" sizes="any" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <img class="boot-logo boot-dark" src="skynova-escuro.svg" alt="Skynova — Soluções em nuvem" />
            <img class="boot-logo boot-light" src="skynova-claro.svg" alt="" aria-hidden="true" />
            <p class="boot-name">SkyAPI</p>
            <p class="boot-note">Carregando o assistente de operações…</p>
            <div class="boot-track"><div class="boot-bar"></div></div>
            <p class="boot-percent"></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado nesta aba. Recarregue a página; as operações em andamento e o histórico em memória serão perdidos.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss" role="button" aria-label="Fechar aviso">🗙</a>
    </div>

    <script src="sky.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
